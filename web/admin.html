<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKSC Parking · Admin</title><link rel="icon" href="/icon.svg">
<style>
:root{--p:#0f2a4a;--p2:#1d4f8c;--a:#f59e0b;--g:#16a34a;--r:#dc2626;--bg:#f4f6fa;--t:#0f172a;--m:#64748b;--b:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--p);color:#cbd5e1;padding:18px 12px;display:flex;flex-direction:column;overflow:auto;z-index:10}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px;color:#fff}.brand .lg{width:40px;height:40px;border-radius:11px;background:var(--a);color:var(--p);display:grid;place-items:center;font-weight:900;font-size:22px}.brand small{display:block;color:#94a3b8;font-size:11px}
.side h6{font-size:10px;letter-spacing:.25em;color:#64748b;margin:16px 10px 6px}.side a{display:flex;justify-content:space-between;padding:9px 10px;border-radius:9px;color:#cbd5e1;text-decoration:none;font-weight:500;cursor:pointer}.side a:hover{background:#ffffff0f}.side a.on{background:#ffffff1a;color:#fff}.side a span{background:var(--a);color:var(--p);border-radius:20px;padding:0 7px;font-size:11px;font-weight:800}
.side .foot{margin-top:auto;font-size:12px;padding:10px;background:#ffffff0d;border-radius:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px}
main{margin-left:230px;padding:18px 26px 40px}.tb{display:flex;gap:12px;align-items:center;margin-bottom:18px}.tb input{flex:1;max-width:520px}
h1{font-size:22px;margin:0}.sub{color:var(--m);margin:4px 0 16px}
.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px}.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.kpi small{color:var(--m);font-weight:600}.kpi b{display:block;font-size:24px;margin:6px 0 2px}.kpi i{font-style:normal;color:var(--m);font-size:12px}.up{color:var(--g)!important}.dn{color:var(--r)!important}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.05em;padding:8px 8px;border-bottom:1px solid var(--b);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid #f1f5f9;white-space:nowrap}tr:hover td{background:#fafcff}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#e2e8f0}.pill.g{background:#dcfce7;color:#166534}.pill.r{background:#fee2e2;color:#991b1b}.pill.b{background:#dbeafe;color:#1e40af}.pill.a{background:#fef3c7;color:#92400e}
button,.bt{border:1px solid var(--b);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;color:var(--t)}.bt.p,button.p{background:var(--p2);color:#fff;border-color:var(--p2)}button.r{color:var(--r)}
input,select{padding:9px 11px;border:1px solid var(--b);border-radius:9px;font-size:14px;background:#fff}
.tabs{display:inline-flex;background:#e8edf4;border-radius:10px;padding:3px}.tabs button{border:0;background:none;padding:7px 14px}.tabs button.on{background:#fff;box-shadow:0 1px 2px #0002}
.bars .r{display:flex;align-items:center;gap:10px;margin:9px 0}.bars .r span{width:120px}.bars .r .bb{flex:1;height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}.bars .r .bb i{display:block;height:100%;background:var(--p2);border-radius:6px}.bars .r b{width:90px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.tot{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.tot div{background:#f8fafc;border-radius:10px;padding:10px}.tot b{display:block;font-size:18px}
.modal{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;z-index:50}.modal .card{width:440px;max-width:94vw;max-height:90vh;overflow:auto}.modal label{display:block;font-size:12px;color:var(--m);font-weight:600;margin:10px 0 4px}.modal input,.modal select{width:100%}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:99}
.login{max-width:380px;margin:12vh auto}.login input{width:100%;margin:6px 0 12px}
.tar input{width:70px;padding:6px 8px}.tbl-wrap{overflow:auto}
svg text{font-size:10px;fill:#64748b}
.mb{display:none}
@media(max-width:900px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}main{margin-left:0;padding:14px}.g6,.g4,.g3,.g2,.tot{grid-template-columns:1fr 1fr}.mb{display:inline-block}}
@media print{.side,.tb,.noprint{display:none!important}main{margin:0}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');const TY=['cycle','bike','auto','car','bus'];const TL={cycle:'Cycle',bike:'Scooter / Bike',auto:'Auto / Toto',car:'Car',bus:'Bus / Mini bus'};const TS={cycle:'Cycle',bike:'Bike',auto:'Auto',car:'Car',bus:'Bus'};
const IST={timeZone:'Asia/Kolkata'};const tm=d=>d?new Date(d).toLocaleTimeString('en-IN',{...IST,hour:'2-digit',minute:'2-digit'}):'—';const dt=d=>d?new Date(d).toLocaleString('en-IN',{...IST,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const dur=m=>{if(m==null)return'—';m=Math.round(m);return m<60?m+' m':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' m'};const today=()=>new Date(Date.now()+19800e3).toISOString().slice(0,10);
const KIND={parking:'Parking',pd:'P&D',pass:'Pass'};
let TOK=localStorage.atok||'',ME=JSON.parse(localStorage.ame||'null'),CFG=null,page=location.hash.slice(1)||'dashboard',timer=null;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+TOK},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({error:'Network error'}));if(r.status===401&&!p.includes('login')){logout();throw new Error('Login expired')}if(!r.ok)throw new Error(j.error||'Error');return j}
function logout(){localStorage.removeItem('atok');TOK='';render()}
function csv(name,rows){const s=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+s],{type:'text/csv'}));a.download=name+'.csv';a.click()}
function modal(html,onok){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${html}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button data-x>Cancel</button><button class="p" data-ok>Save</button></div></div>`;document.body.appendChild(m);m.querySelector('[data-x]').onclick=()=>m.remove();m.querySelector('[data-ok]').onclick=async()=>{try{await onok(m);m.remove()}catch(e){toast(e.message)}};return m}
const val=(m,k)=>m.querySelector(`[name=${k}]`).value;

function render(){clearInterval(timer);if(!TOK)return loginView();
const L=[['MENU'],['dashboard','Dashboard'],['inside','Vehicles Inside','<span id="insb"></span>'],['records','Day-wise Records'],['reports','Reports'],['MANAGE'],['passes','Monthly Passes'],['staff','Staff & Shifts'],['stands','Parking Stands'],['SETUP'],['tariff','Tariff'],['settings','Settings'],['audit','Change log']];
$('#root').innerHTML=`<aside class="side" id="side"><div class="brand"><div class="lg">P</div><div><b>${esc(CFG?.short||'BKSC')} PARKING</b><small>${esc(CFG?.agency||'')}</small></div></div>
${L.map(x=>x.length===1?`<h6>${x[0]}</h6>`:`<a class="${x[0]===page?'on':''}" href="#${x[0]}">${x[1]}${x[2]||''}</a>`).join('')}
<div class="foot"><div id="duty"><span class="dot"></span>Live</div><div style="margin-top:8px;color:#fff">${esc(ME?.name||'Admin')} · Owner</div><a onclick="logout()" style="padding:4px 0">Logout</a></div></aside>
<main><div class="tb"><button class="mb" onclick="$('#side').classList.toggle('open')">☰</button><input id="gs" placeholder="Search vehicle no., token no., mobile…"><a class="bt" href="/app" target="_blank">Attendant app ↗</a></div><div id="pg">Loading…</div></main>`;
$('#gs').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())search(e.target.value.trim())};
api('/api/admin/stands').then(st=>{const n=st.reduce((a,b)=>a+b.occupied,0);const e=$('#insb');if(e)e.innerHTML=`<span>${n}</span>`}).catch(()=>{});
(P[page]||P.dashboard)().catch(e=>$('#pg').innerHTML=`<div class="card">${esc(e.message)}</div>`)}
window.onhashchange=()=>{page=location.hash.slice(1)||'dashboard';render()};

function loginView(){$('#root').innerHTML=`<div class="login card"><div class="brand" style="color:var(--t)"><div class="lg">P</div><div><b>BKSC PARKING</b><small>Owner / Admin login</small></div></div>
<label>Mobile</label><input id="m" inputmode="numeric"><label>Password</label><input id="pw" type="password"><button class="p" style="width:100%;padding:12px" id="lb">Login</button></div>`;
const go=async()=>{try{const r=await api('/api/login',{mobile:$('#m').value,secret:$('#pw').value,as:'admin'});TOK=r.token;ME=r.user;localStorage.atok=TOK;localStorage.ame=JSON.stringify(ME);await loadCfg();render()}catch(e){toast(e.message)}};$('#lb').onclick=go;$('#pw').onkeydown=e=>e.key==='Enter'&&go()}
async function loadCfg(){CFG=await api('/api/admin/config')}

function rowsTable(rows,opts={}){return `<div class="tbl-wrap"><table><tr><th>Token</th><th>Vehicle no.</th><th>Type</th><th>Entry</th><th>In</th><th>Out</th><th>Duration</th><th>Slab</th><th>Helmet</th><th>Charge</th><th>Mode</th><th>By</th><th class="noprint"></th></tr>
${rows.map(r=>`<tr><td><b>${esc(r.token_no)}</b></td><td>${esc(r.vehicle_no)}</td><td>${TS[r.vtype]}</td><td>${KIND[r.kind]}</td><td>${opts.full?dt(r.in_at):tm(r.in_at)}</td><td>${r.out_at?(opts.full?dt(r.out_at):tm(r.out_at)):'<span class="pill b">Inside</span>'}</td><td>${dur(r.minutes)}</td><td>${esc(r.slab||'—')}</td><td>${r.amt_helmet?rs(r.amt_helmet):'—'}</td><td><b>${r.status==='out'?(r.amount?rs(r.amount):r.kind==='pass'?'—':'Free'):'—'}</b></td><td>${r.pay_mode?`<span class="pill ${r.pay_mode==='UPI'?'b':r.pay_mode==='Cash'?'g':''}">${r.pay_mode}</span>`:'—'}</td><td>${esc(r.out_by_name||r.in_by_name||'')}</td><td class="noprint"><button onclick='editT(${JSON.stringify({id:r.id,vehicle_no:r.vehicle_no,vtype:r.vtype,amount:r.amount,pay_mode:r.pay_mode})})'>Edit</button></td></tr>`).join('')||'<tr><td colspan=13 style="color:var(--m)">No records</td></tr>'}</table></div>`}
function editT(t){const m=modal(`<h3>Edit token</h3><label>Vehicle no.</label><input name=vehicle_no value="${esc(t.vehicle_no)}"><label>Type</label><select name=vtype>${TY.map(x=>`<option value=${x} ${x===t.vtype?'selected':''}>${TL[x]}</option>`).join('')}</select><label>Charge (₹)</label><input name=amount value="${t.amount}"><label>Payment mode</label><select name=pay_mode>${['Cash','UPI','Pass','Free'].map(x=>`<option ${x===t.pay_mode?'selected':''}>${x}</option>`).join('')}</select><label>Reason (logged)</label><input name=reason><div style="margin-top:12px"><button class="r" data-del>Delete token</button></div>`,async m=>{await api('/api/admin/ticket',{id:t.id,vehicle_no:val(m,'vehicle_no'),vtype:val(m,'vtype'),amount:val(m,'amount'),pay_mode:val(m,'pay_mode'),reason:val(m,'reason')});toast('Saved · logged');render()});
m.querySelector('[data-del]').onclick=async()=>{if(!confirm('Token delete karein? (logged)'))return;await api('/api/admin/ticket',{id:t.id,delete:true,reason:val(m,'reason')});m.remove();toast('Deleted · logged');render()}}
async function search(q){const rows=await api('/api/admin/search?q='+encodeURIComponent(q));$('#pg').innerHTML=`<h1>Search: ${esc(q)}</h1><p class="sub">${rows.length} results</p><div class="card">${rowsTable(rows,{full:1})}</div>`}

function lineChart(pts,key,h=200){if(!pts.length)return'<div class="sub">No data</div>';const W=700,max=Math.max(5,...pts.map(p=>p[key]));const x=i=>30+i*(W-40)/Math.max(1,pts.length-1),y=v=>h-20-(v/max)*(h-40);
const path=pts.map((p,i)=>(i?'L':'M')+x(i)+','+y(p[key])).join('');return `<svg viewBox="0 0 ${W} ${h}" width="100%">${[0,.5,1].map(f=>`<line x1=30 x2=${W} y1=${y(max*f)} y2=${y(max*f)} stroke="#eef2f7"/><text x=0 y=${y(max*f)+3}>${Math.round(max*f)}</text>`).join('')}
<path d="${path} L${x(pts.length-1)},${h-20} L30,${h-20}Z" fill="#1d4f8c18"/><path d="${path}" fill="none" stroke="#1d4f8c" stroke-width="2.5"/>${pts.map((p,i)=>`<text x=${x(i)-8} y=${h-4}>${p.label}</text>`).join('')}</svg>`}
function barChart(pts,h=200){if(!pts.length)return'<div class="sub">No data</div>';const W=700,max=Math.max(1,...pts.map(p=>p.v)),bw=(W-40)/pts.length;return `<svg viewBox="0 0 ${W} ${h}" width="100%">${pts.map((p,i)=>{const bh=(p.v/max)*(h-40);return `<rect x=${32+i*bw} y=${h-20-bh} width=${Math.max(2,bw-4)} height=${bh} rx=3 fill="#1d4f8c"><title>${p.label}: ${rs(p.v)}</title></rect><text x=${32+i*bw} y=${h-4}>${p.label}</text>`}).join('')}<text x=0 y=12>${rs(max)}</text></svg>`}
function typeBars(by){const m=Object.fromEntries(by.map(r=>[r.vtype,r]));const mx=Math.max(1,...by.map(r=>r.amt));return `<div class="bars">${TY.map(t=>{const r=m[t]||{n:0,amt:0};return `<div class="r"><span>${TL[t]} · ${r.n}</span><div class="bb"><i style="width:${r.amt/mx*100}%"></i></div><b>${rs(r.amt)}</b></div>`}).join('')}</div>`}

const P={};
P.dashboard=async(range)=>{range=range||P._range||'today';P._range=range;const d=await api('/api/admin/dashboard?range='+range);const k=d.k;
$('#insb').innerHTML=`<span>${k.inside}</span>`;$('#duty').innerHTML=`<span class="dot"></span>${d.onDuty.length} attendants on duty`;
const ch=k.prev_collection?Math.round((k.collection-k.prev_collection)/k.prev_collection*100):null;const tc=k.cash+k.upi||1;
const busy=d.hourly.reduce((a,b)=>b.entered>(a?.entered||0)?b:a,null);
$('#pg').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px"><div><h1>${range==='today'?'Today':range==='yesterday'?'Yesterday':'This month'} at a glance</h1><p class="sub">${new Date().toLocaleDateString('en-IN',{...IST,weekday:'long',day:'numeric',month:'short',year:'numeric'})} · live from all attendant phones</p></div>
<div class="tabs">${[['today','Today'],['yesterday','Yesterday'],['month','This month']].map(([a,b])=>`<button class="${a===range?'on':''}" onclick="P.dashboard('${a}')">${b}</button>`).join('')}</div></div>
<div class="grid g6"><div class="card kpi"><small>Collection</small><b>${rs(k.collection)}</b><i class="${ch>=0?'up':'dn'}">${ch==null?'':(ch>=0?'↑ ':'↓ ')+Math.abs(ch)+'% vs last '+(range==='month'?'month':'week')}</i></div>
<div class="card kpi"><small>Vehicles IN</small><b>${k.vin}</b><i>${range==='today'?'since 12 AM':''}</i></div><div class="card kpi"><small>Vehicles OUT</small><b>${k.vout}</b><i>avg stay ${dur(k.avg_stay)}</i></div>
<div class="card kpi"><small>Inside now</small><b>${k.inside}</b><i class="${k.over24?'dn':''}">${k.over24} parked over 24 hrs</i></div><div class="card kpi"><small>Pick & Drop</small><b>${k.pd}</b><i>${k.pd_free} free · ${rs(k.pd_amt)} charged</i></div>
<div class="card kpi"><small>Cash vs UPI</small><b>${Math.round(k.cash/tc*100)}% · ${Math.round(k.upi/tc*100)}%</b><i>${rs(k.cash)} · ${rs(k.upi)}</i></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Vehicles inside — hour by hour <span class="pill">Today</span></h3>${lineChart(d.hourly.map(h=>({label:(h.hr%12||12)+(h.hr<12?'A':'P'),inside:h.inside})),'inside')}</div>
<div class="card"><h3>By vehicle type</h3>${typeBars(d.byType)}${busy&&busy.entered?`<div class="sub" style="margin-top:12px">Busiest hour today: ${busy.hr}–${busy.hr+1} (${busy.entered} vehicles in)</div>`:''}</div></div>
<div class="grid g3" style="margin-top:14px">${d.stands.map(s=>`<div class="card"><h3>${esc(s.name)}<span class="pill ${s.occupied/s.capacity>=.9?'r':'g'}">${s.occupied} / ${s.capacity}</span></h3><div class="bars"><div class="r"><div class="bb"><i style="width:${Math.min(100,s.occupied/s.capacity*100)}%;background:${s.occupied/s.capacity>=.9?'var(--r)':'var(--g)'}"></i></div></div></div></div>`).join('')}</div>
<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px"><div class="card"><h3>Attendants on duty <span class="pill g">Live</span></h3><table><tr><th>Attendant</th><th>Gate</th><th>In / Out</th><th>Collected</th></tr>${d.onDuty.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="sub" style="margin:0">${esc(a.shift_label||'since '+tm(a.start_at))}</div></td><td>${esc(a.stand||'')}</td><td>${a.in} / ${a.out}</td><td><b>${rs(a.cash+a.upi)}</b></td></tr>`).join('')||'<tr><td colspan=4 class="sub">Koi on duty nahi</td></tr>'}</table></div>
<div class="card"><h3>Parked more than 24 hrs <span class="pill a">Daily charge running</span></h3><table><tr><th>Vehicle</th><th>Type</th><th>In</th><th>Parked</th><th>Due now</th></tr>${d.over.map(r=>`<tr><td><b>${esc(r.vehicle_no)}</b></td><td>${TS[r.vtype]}</td><td>${dt(r.in_at)}</td><td>${dur(r.live.minutes)}</td><td><b>${rs(r.live.total)}</b></td></tr>`).join('')||'<tr><td colspan=5 class="sub">None</td></tr>'}</table></div></div>`;
timer=setInterval(()=>page==='dashboard'&&P.dashboard(),60000)};

P.inside=async()=>{const rows=await api('/api/admin/inside');let f='';const draw=()=>{const r=rows.filter(x=>!f||x.vtype===f);$('#tbl').innerHTML=`<table><tr><th>Token</th><th>Vehicle</th><th>Type</th><th>Entry</th><th>In</th><th>Parked</th><th>Due now</th><th>By</th></tr>${r.map(x=>`<tr><td><b>${esc(x.token_no)}</b></td><td>${esc(x.vehicle_no)} ${x.live.minutes>1440?'<span class="pill r">24 hr+</span>':''}</td><td>${TS[x.vtype]}</td><td>${KIND[x.kind]}</td><td>${dt(x.in_at)}</td><td>${dur(x.live.minutes)}</td><td><b>${rs(x.live.total)}</b></td><td>${esc(x.in_by_name||'')}</td></tr>`).join('')}</table>`;
$('#ch').innerHTML=[['','All '+rows.length],...TY.map(t=>[t,TS[t]+' '+rows.filter(x=>x.vtype===t).length])].map(([k,l])=>`<button class="${k===f?'on':''}" data-f="${k}">${l}</button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=b.dataset.f;draw()})};
$('#pg').innerHTML=`<h1>Vehicles Inside · ${rows.length}</h1><p class="sub">Running charge calculated live</p><div class="card"><div class="chips" id="ch"></div><div id="tbl" class="tbl-wrap"></div></div>`;draw()};

P.records=async()=>{const date=P._date||today();const all=await api('/api/admin/records?date='+date);let f={t:'',k:'',m:''};
const draw=()=>{const r=all.filter(x=>(!f.t||x.vtype===f.t)&&(!f.k||x.kind===f.k)&&(!f.m||x.pay_mode===f.m));const out=r.filter(x=>x.status==='out');const s=(fn)=>out.filter(fn).reduce((a,b)=>a+b.amount,0);
$('#ch').innerHTML=[['t','','All '+all.length],...TY.map(t=>['t',t,TS[t]+' '+all.filter(x=>x.vtype===t).length]),['k','pd','Pick & Drop'],['k','pass','Pass'],['m','Cash','Cash'],['m','UPI','UPI']].map(([g,k,l])=>`<button class="${f[g]===k&&(k||g==='t')?'on':''}" data-g="${g}" data-k="${k}">${l}</button>`).join('');
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g,k=b.dataset.k;f[g]=f[g]===k&&g!=='t'?'':k;draw()});
$('#tbl').innerHTML=rowsTable(r);$('#tot').innerHTML=`<div><small>Total vehicles</small><b>${r.length}</b></div><div><small>Total collection</small><b>${rs(s(()=>1))}</b></div><div><small>Cash</small><b>${rs(s(x=>x.pay_mode==='Cash'))}</b></div><div><small>UPI</small><b>${rs(s(x=>x.pay_mode==='UPI'))}</b></div><div><small>Pick & Drop · Helmet</small><b>${rs(s(x=>x.kind==='pd'))} · ${rs(out.reduce((a,b)=>a+b.amt_helmet,0))}</b></div>`;P._rows=r};
$('#pg').innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h1>Day-wise Records</h1><p class="sub">Full data of every vehicle — kept forever, search any date</p></div><div class="noprint" style="display:flex;gap:8px;align-items:center"><button id="xl">Excel</button><button onclick="print()">PDF / Print day report</button></div></div>
<div class="card"><input type="date" id="d" value="${date}" class="noprint"><div class="chips noprint" id="ch"></div><div id="tbl"></div><div class="tot" id="tot"></div></div>`;
$('#d').onchange=e=>{P._date=e.target.value;P.records()};$('#xl').onclick=()=>csv('records-'+date,[['Token','Vehicle','Type','Entry','In','Out','Duration (min)','Slab','Helmet','Charge','Mode','By'],...P._rows.map(r=>[r.token_no,r.vehicle_no,TL[r.vtype],KIND[r.kind],dt(r.in_at),dt(r.out_at),r.minutes,r.slab,r.amt_helmet,r.amount,r.pay_mode,r.out_by_name||r.in_by_name])]);draw()};

P.reports=async()=>{const month=P._month||today().slice(0,7);const d=await api('/api/admin/reports?month='+month);const k=d.k;const ch=d.prev.collection?Math.round((k.collection-d.prev.collection)/d.prev.collection*100):null;const nd=d.days.length||1;
const tot=k.cash+k.upi+d.passes.amt||1;
$('#pg').innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h1>Reports</h1><p class="sub">${new Date(month+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'})} · all parking sites</p></div><input type="month" id="mo" value="${month}"></div>
<div class="grid g4"><div class="card kpi"><small>Month collection</small><b>${rs(k.collection)}</b><i class="${ch>=0?'up':'dn'}">${ch==null?'':(ch>=0?'↑ ':'↓ ')+Math.abs(ch)+'% vs last month'}</i></div><div class="card kpi"><small>Vehicles parked</small><b>${k.vehicles.toLocaleString('en-IN')}</b><i>avg ${Math.round(k.vehicles/nd)} / day</i></div>
<div class="card kpi"><small>Monthly passes</small><b>${rs(d.passes.amt)}</b><i>${d.passes.active} active passes</i></div><div class="card kpi"><small>Pick & Drop · Helmet</small><b>${rs(k.pd_amt+k.helmet_amt)}</b><i>${k.pd_n} P&D trips · ${k.helmet_n} helmets</i></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Day-wise collection</h3>${barChart(d.days.map(x=>({label:x.d.slice(8),v:x.amt})))}</div><div class="card"><h3>Payment mode</h3><div class="bars">${[['Cash',k.cash],['UPI',k.upi],['Passes',d.passes.amt]].map(([l,v])=>`<div class="r"><span>${l} ${Math.round(v/tot*100)}%</span><div class="bb"><i style="width:${v/tot*100}%"></i></div><b>${rs(v)}</b></div>`).join('')}</div></div></div>
<div class="grid g3" style="margin-top:14px"><div class="card"><h3>By vehicle type</h3>${typeBars(d.byType)}</div><div class="card"><h3>By attendant</h3><table>${d.byStaff.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.n}</td><td><b>${rs(s.amt)}</b></td></tr>`).join('')||'<tr><td class="sub">No data</td></tr>'}</table></div>
<div class="card"><h3>Download reports <span class="pill">Excel</span></h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button data-r="day">Day-wise register</button><button data-r="sum">Month summary</button><button data-r="shift">Shift cash report</button><button data-r="type">Vehicle type report</button><button data-r="pd">Pick & Drop report</button><button data-r="pass">Pass report</button></div></div></div>`;
$('#mo').onchange=e=>{P._month=e.target.value;P.reports()};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const r=b.dataset.r;
if(r==='sum'||r==='day')return csv(r+'-'+month,[['Date','Vehicles','Collection'],...d.days.map(x=>[x.d,x.n,x.amt]),['Total',k.vehicles,k.collection]]);
if(r==='type')return csv('type-'+month,[['Type','Vehicles','Collection'],...d.byType.map(x=>[TL[x.vtype],x.n,x.amt])]);
if(r==='shift')return csv('shifts-'+month,[['Attendant','Stand','Start','End','Cash (system)','Cash (handed)','UPI','Status','Handed to'],...d.shifts.map(s=>[s.name,s.stand,dt(s.start_at),dt(s.end_at),s.cash_system,s.cash_handed,s.upi_system,s.status,s.handed_to])]);
if(r==='pass'){const ps=await api('/api/admin/passes');return csv('passes',[['Holder','Mobile','Vehicle','Type','From','To','Amount','Mode','Valid'],...ps.map(p=>[p.holder,p.mobile,p.vehicle_no,TL[p.vtype],p.start_date?.slice(0,10),p.end_date?.slice(0,10),p.amount,p.pay_mode,p.valid?'Yes':'No'])])}
if(r==='pd'){const rows=[];for(const x of d.days){const rr=await api('/api/admin/records?date='+x.d);rows.push(...rr.filter(t=>t.kind==='pd'&&t.status==='out'&&t.out_at.slice(0,7)===month))}return csv('pick-drop-'+month,[['Token','Vehicle','Type','In','Out','Minutes','Charge','Mode'],...rows.map(t=>[t.token_no,t.vehicle_no,TL[t.vtype],dt(t.in_at),dt(t.out_at),t.minutes,t.amount,t.pay_mode])])}})};

P.passes=async()=>{const ps=await api('/api/admin/passes');$('#pg').innerHTML=`<div style="display:flex;justify-content:space-between"><div><h1>Monthly Passes</h1><p class="sub">Pass vehicles exit free — attendant app auto-detects by vehicle number</p></div><div><button class="p" id="ad">+ New pass</button></div></div>
<div class="card tbl-wrap"><table><tr><th>Vehicle</th><th>Type</th><th>Holder</th><th>Mobile</th><th>From</th><th>To</th><th>Amount</th><th>Mode</th><th>Status</th><th></th></tr>${ps.map(p=>`<tr><td><b>${esc(p.vehicle_no)}</b></td><td>${TS[p.vtype]}</td><td>${esc(p.holder)}</td><td>${esc(p.mobile)}</td><td>${String(p.start_date).slice(0,10)}</td><td>${String(p.end_date).slice(0,10)}</td><td>${rs(p.amount)}</td><td>${esc(p.pay_mode)}</td><td>${p.valid?'<span class="pill g">Active</span>':'<span class="pill">Expired</span>'}</td><td>${p.valid?`<button class="r" onclick="cancelPass(${p.id})">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan=10 class="sub">No passes yet</td></tr>'}</table></div>`;
$('#ad').onclick=()=>{const m=modal(`<h3>New monthly pass</h3><label>Vehicle no.</label><input name=vehicle_no><label>Type</label><select name=vtype>${TY.filter(t=>CFG.tariff.pass[t]).map(t=>`<option value=${t}>${TL[t]} — ${rs(CFG.tariff.pass[t])}</option>`).join('')}</select><label>Holder name</label><input name=holder><label>Mobile</label><input name=mobile><label>Start date</label><input type=date name=start_date value="${today()}"><label>Amount (blank = tariff)</label><input name=amount><label>Payment</label><select name=pay_mode><option>Cash</option><option>UPI</option></select>`,async m=>{await api('/api/admin/passes',{vehicle_no:val(m,'vehicle_no'),vtype:val(m,'vtype'),holder:val(m,'holder'),mobile:val(m,'mobile'),start_date:val(m,'start_date'),amount:val(m,'amount'),pay_mode:val(m,'pay_mode')});toast('Pass created');render()})}};
async function cancelPass(id){if(confirm('Pass cancel karein?')){await api('/api/admin/passes/cancel',{id});render()}}

P.staff=async()=>{const date=P._sdate||today();const [st,sh,stands]=await Promise.all([api('/api/admin/staff'),api('/api/admin/shifts?date='+date),api('/api/admin/stands')]);
$('#pg').innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h1>Staff, Shifts & Stands</h1><p class="sub">Add attendants, assign gates, check every shift's cash</p></div><div style="display:flex;gap:8px"><button onclick="location.hash='stands'">Add stand</button><button class="p" onclick="editStaff()">+ Add attendant</button></div></div>
<div class="grid g3">${stands.filter(s=>s.active).map(s=>`<div class="card"><h3>${esc(s.name)}<span class="pill g">Open 24×7</span></h3><div class="sub" style="margin:0">${esc(s.area)} ${s.area?'·':''} ${esc(s.info)}</div><div style="margin-top:8px"><b>${s.occupied} / ${s.capacity}</b> occupied</div></div>`).join('')}</div>
<div class="card" style="margin-top:14px"><h3>Shift history — <input type="date" id="sd" value="${date}"> <span class="pill">Cash check</span></h3><div class="tbl-wrap"><table><tr><th>Attendant</th><th>Gate</th><th>Shift</th><th>Vehicles</th><th>Cash (system)</th><th>Cash (handed)</th><th>UPI</th><th>Status</th></tr>
${sh.map(s=>{const cs=s.status==='open'?s.live.cash:s.cash_system,diff=(s.cash_handed??0)-cs;return `<tr><td><b>${esc(s.name)}</b><div class="sub" style="margin:0">+91 ${esc(s.mobile.slice(0,2))}•••••${esc(s.mobile.slice(-3))}</div></td><td>${esc(s.stand||'')}</td><td>${tm(s.start_at)} – ${s.end_at?tm(s.end_at):'now'}</td><td>${s.live.in+s.live.out}</td><td>${rs(cs)}</td><td>${s.cash_handed==null?'—':rs(s.cash_handed)}</td><td>${rs(s.status==='open'?s.live.upi:s.upi_system)}</td><td>${s.status==='open'?'<span class="pill b">On duty</span>':diff===0?'<span class="pill g">Matched</span>':`<span class="pill r">${rs(Math.abs(diff))} ${diff<0?'short':'extra'}</span>`}${s.handed_to?`<div class="sub" style="margin:0">→ ${esc(s.handed_to)}</div>`:''}</td></tr>`}).join('')||'<tr><td colspan=8 class="sub">No shifts</td></tr>'}</table></div></div>
<div class="card" style="margin-top:14px"><h3>All staff</h3><div class="tbl-wrap"><table><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Stand</th><th>Shift</th><th>Notes / ID</th><th>Status</th><th></th></tr>${st.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.mobile)}</td><td>${s.role}</td><td>${esc(s.stand||'')}</td><td>${esc(s.shift_label)}</td><td>${esc(s.notes)}</td><td>${s.active?'<span class="pill g">Active</span>':'<span class="pill">Disabled</span>'}</td><td>${s.role==='attendant'?`<button onclick='editStaff(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Edit</button>`:''}</td></tr>`).join('')}</table></div>
<p class="sub">Attendants can't delete or edit a token — only admin can, and every change is logged (Change log).</p></div>`;$('#sd').onchange=e=>{P._sdate=e.target.value;P.staff()};P._stands=stands};
function editStaff(s={}){const stands=P._stands||[];modal(`<h3>${s.id?'Edit':'Add'} attendant</h3><label>Name</label><input name=name value="${esc(s.name||'')}"><label>Mobile</label><input name=mobile value="${esc(s.mobile||'')}"><label>${s.id?'New 4-digit PIN (blank = same)':'4-digit PIN'}</label><input name=secret inputmode=numeric maxlength=4>
<label>Default stand</label><select name=stand_id>${stands.map(x=>`<option value=${x.id} ${x.id===s.stand_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label>Shift</label><input name=shift_label value="${esc(s.shift_label||'6 AM – 2 PM')}"><label>Notes (ID card / police verification no.)</label><input name=notes value="${esc(s.notes||'')}">${s.id?`<label>Status</label><select name=active><option value=1>Active</option><option value=0 ${s.active?'':'selected'}>Disabled</option></select>`:''}`,
async m=>{await api('/api/admin/staff',{id:s.id,name:val(m,'name'),mobile:val(m,'mobile'),secret:val(m,'secret'),stand_id:val(m,'stand_id'),shift_label:val(m,'shift_label'),notes:val(m,'notes'),active:s.id?val(m,'active')==='1':true});toast('Saved');render()})}

P.stands=async()=>{const st=await api('/api/admin/stands');$('#pg').innerHTML=`<div style="display:flex;justify-content:space-between"><div><h1>Parking Stands</h1><p class="sub">Capacity is used for the 90% full alert</p></div><button class="p" onclick="editStand()">+ Add stand</button></div>
<div class="card"><table><tr><th>Stand</th><th>Info</th><th>Area</th><th>Vehicle types</th><th>Occupied</th><th>Status</th><th></th></tr>${st.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.info)}</td><td>${esc(s.area)}</td><td>${esc(s.types)}</td><td>${s.occupied} / ${s.capacity}</td><td>${s.active?'<span class="pill g">Open</span>':'<span class="pill">Closed</span>'}</td><td><button onclick='editStand(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Edit</button></td></tr>`).join('')}</table></div>`};
function editStand(s={}){modal(`<h3>${s.id?'Edit':'Add'} stand</h3><label>Name</label><input name=name value="${esc(s.name||'')}"><label>Info</label><input name=info value="${esc(s.info||'')}"><label>Area</label><input name=area value="${esc(s.area||'')}"><label>Capacity</label><input name=capacity value="${s.capacity||100}"><label>Vehicle types (comma)</label><input name=types value="${esc(s.types||TY.join(','))}"><label>Status</label><select name=active><option value=1>Open</option><option value=0 ${s.active===false?'selected':''}>Closed</option></select>`,
async m=>{await api('/api/admin/stands',{id:s.id,name:val(m,'name'),info:val(m,'info'),area:val(m,'area'),capacity:val(m,'capacity'),types:val(m,'types'),active:val(m,'active')==='1'});toast('Saved');render()})}

P.tariff=async()=>{await loadCfg();const t=JSON.parse(JSON.stringify(CFG.tariff));const inp=(path,v)=>`<input data-p="${path}" value="${v}">`;
$('#pg').innerHTML=`<div style="display:flex;justify-content:space-between"><div><h1>Tariff & Rules</h1><p class="sub">Railway tariff + Pick & Drop — every attendant phone updates instantly</p></div><button class="p" id="sv">Save changes</button></div>
<div class="card tar"><h3>Parking tariff — ${esc(CFG.station)} <span class="sub" style="margin:0">₹ incl. GST · as per Railway</span></h3><table><tr><th>Parking time</th>${TY.map(x=>`<th>${TS[x]}</th>`).join('')}</tr>
${['Up to 2 hrs','2 – 6 hrs','6 – 12 hrs','12 – 24 hrs'].map((l,i)=>`<tr><td>${l}</td>${TY.map(x=>`<td>${inp(`parking.${x}.${i}`,t.parking[x][i])}</td>`).join('')}</tr>`).join('')}
<tr><td>Beyond 24 hrs (per day)</td>${TY.map(x=>`<td>${inp(`perDay.${x}`,t.perDay[x])}</td>`).join('')}</tr><tr><td>Monthly pass</td>${TY.map(x=>`<td>${inp(`pass.${x}`,t.pass[x])}</td>`).join('')}</tr></table></div>
<div class="card tar" style="margin-top:14px"><h3>Pick & Drop tariff <span class="sub" style="margin:0">Separate · above ${t.pdMax} min → parking tariff</span></h3><table><tr><th>Pick & Drop</th>${TY.map(x=>`<th>${TS[x]}</th>`).join('')}</tr><tr><td>Up to ${t.pdFree} min</td>${TY.map(()=>`<td>Free</td>`).join('')}</tr><tr><td>${t.pdFree} – ${t.pdMax} min</td>${TY.map(x=>`<td>${inp(`pd.${x}`,t.pd[x])}</td>`).join('')}</tr></table></div>
<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px"><div class="card tar"><h3>Tariff rules <span class="sub" style="margin:0">Applied automatically at exit</span></h3><table>
<tr><td>Pick & Drop free time (min)</td><td>${inp('pdFree',t.pdFree)}</td></tr><tr><td>Pick & Drop max time (min)</td><td>${inp('pdMax',t.pdMax)}</td></tr><tr><td>Helmet charge (₹ / 24 hr)</td><td>${inp('helmet',t.helmet)}</td></tr><tr><td>Lost token penalty (₹)</td><td>${inp('lostToken',t.lostToken)}</td></tr></table></div>
<div class="card"><h3>Printed on token & receipt</h3><div class="sub">Agency ${esc(CFG.agency)} · Contractor ${esc(CFG.contractor)}<br>GSTIN ${esc(CFG.gstin)} · Ph ${esc(CFG.phone)}<br>Agreement ${esc(CFG.agreement)}</div><a href="#settings">Edit in Settings →</a></div></div>`;
$('#sv').onclick=async()=>{document.querySelectorAll('[data-p]').forEach(i=>{const p=i.dataset.p.split('.');let o=t;while(p.length>1)o=o[p.shift()];o[p[0]]=Number(i.value)||0});try{CFG=await api('/api/admin/config',{tariff:t});toast('Tariff saved — all phones updated')}catch(e){toast(e.message)}}};

P.settings=async()=>{await loadCfg();const F=[['agency','Agency name'],['contractor','Contractor'],['gstin','GSTIN'],['phone','Phone'],['agreement','Agreement no.'],['station','Station (short label)'],['stationLong','Station (on slip)'],['short','Code (e.g. BKSC)'],['upiVpa','UPI ID for collection (e.g. nikita@sbi)'],['upiName','UPI payee name']];
$('#pg').innerHTML=`<h1>Settings</h1><p class="sub">Slip header, UPI collection & admin password</p><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Business & slip header</h3>${F.map(([k,l])=>`<label class="sub" style="display:block;margin:10px 0 4px">${l}</label><input style="width:100%" data-k="${k}" value="${esc(CFG[k]||'')}">`).join('')}
<h3 style="margin-top:18px">Admin alerts</h3>${[['dailySummary','Daily collection summary at 11 PM'],['full90','Parking 90% full'],['cashMismatch','Cash mismatch at shift close']].map(([k,l])=>`<label style="display:block;margin:6px 0"><input type="checkbox" data-a="${k}" ${CFG.alerts?.[k]?'checked':''}> ${l}</label>`).join('')}<div style="margin-top:14px"><button class="p" id="sv">Save</button></div></div>
<div class="card"><h3>Change admin password</h3><label class="sub">Current password</label><input type=password id="op" style="width:100%"><label class="sub">New password</label><input type=password id="np" style="width:100%"><div style="margin-top:12px"><button class="p" id="cp">Update password</button></div>
<h3 style="margin-top:24px">Attendant app</h3><div class="sub">Attendants open <b>${location.origin}/app</b> in Chrome on Android → "Install app" / "Add to Home screen". Login: mobile + 4-digit PIN.</div></div></div>`;
$('#sv').onclick=async()=>{const b={alerts:{}};document.querySelectorAll('[data-k]').forEach(i=>b[i.dataset.k]=i.value.trim());document.querySelectorAll('[data-a]').forEach(i=>b.alerts[i.dataset.a]=i.checked);try{CFG=await api('/api/admin/config',b);toast('Saved')}catch(e){toast(e.message)}};
$('#cp').onclick=async()=>{try{await api('/api/admin/password',{old:$('#op').value,new:$('#np').value});toast('Password updated')}catch(e){toast(e.message)}}};

P.audit=async()=>{const a=await api('/api/admin/audit');$('#pg').innerHTML=`<h1>Change log</h1><p class="sub">Every admin edit/delete is recorded</p><div class="card tbl-wrap"><table><tr><th>When</th><th>By</th><th>Action</th><th>Details</th></tr>${a.map(x=>{const d=typeof x.details==='string'?JSON.parse(x.details):x.details;return `<tr><td>${dt(x.at)}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td style="white-space:normal;font-size:12px;color:var(--m)">${esc(d.before?`${d.before.token_no} ${d.before.vehicle_no} ₹${d.before.amount}`+(d.after?` → ${d.after.vehicle_no} ₹${d.after.amount} ${d.after.pay_mode||''}`:'')+(d.reason?` · "${d.reason}"`:''):JSON.stringify(d).slice(0,160))}</td></tr>`}).join('')||'<tr><td colspan=4 class="sub">No changes yet</td></tr>'}</table></div>`};

(async()=>{if(TOK){try{await loadCfg()}catch(e){}}render()})();
</script></body></html>
