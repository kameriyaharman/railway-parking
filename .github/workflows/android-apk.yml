# Builds the React Native attendant app APK on every push to mobile/ (or manually from the Actions tab).
# Download it from the run's "Artifacts" section: bksc-parking-apk.
name: Android APK

on:
  push:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Gradle assembleRelease
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bksc-parking-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Publish APK as GitHub Release (latest)
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BKSC-Parking.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest BKSC-Parking.apk --title "BKSC Parking APK (build ${{ github.run_number }})" --notes "Attendant app — commit ${{ github.sha }}" --latest
